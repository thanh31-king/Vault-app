function faDetectType(bytes){
  const matches = [];
  for(const sig of FA_MAGIC){
    const offset = sig.offset || 0;
    if(bytes.length < offset + sig.sig.length) continue;
    let match = true;
    for(let i=0;i<sig.sig.length;i++){
      if(bytes[offset + i] !== sig.sig[i]){ match = false; break; }
    }
    if(match) matches.push(sig);
  }

  // ISO BMFF brand detection
  if(bytes.length > 12){
    const brand = new TextDecoder('utf-8',{fatal:false}).decode(bytes.slice(4, 12));
    if(/^[\x20-\x7E]{8}$/.test(brand)){
      const brandName = brand.slice(4, 8);
      const isoBrands = {
        'isom':'MP4 (isom)','iso2':'MP4 (iso2)','iso4':'MP4 (iso4)','iso5':'MP4 (iso5)','iso6':'MP4 (iso6)',
        'mp41':'MP4 (mp41)','mp42':'MP4 (mp42)','avc1':'MP4 (AVC)','dash':'MP4 (DASH)','msdh':'MP4 (MSDH)',
        'M4A ':'M4A Audio','M4V ':'M4V Video','M4P ':'M4P (DRM)',
        'ftyp':'ISO Base Media','qt  ':'QuickTime MOV','3gp4':'3GP Video','3gp5':'3GP Video','3g2a':'3G2 Video',
        'heic':'HEIC Image','heix':'HEIC Image','hevc':'HEIC (HEVC)','hevx':'HEIC (HEVC)',
        'mif1':'HEIF Image','msf1':'HEIF Image','avif':'AVIF Image','avis':'AVIF Sequence',
        'crx ':'Canon CRX','cr3 ':'Canon CR3','mmp4':'Mobile MP4','heis':'HEIC Still'
      };
      if(isoBrands[brandName]){
        return {name: isoBrands[brandName], mime:'video/mp4', ext: brandName.toLowerCase().trim(), matches};
      }
    }
  }

  if(matches.length === 0){
    const textBytes = bytes.slice(0, Math.min(bytes.length, 4096));
    if(textBytes[0]===0xEF && textBytes[1]===0xBB && textBytes[2]===0xBF){
      return {name:'UTF-8 Text (BOM)', mime:'text/plain', ext:'txt', matches:[]};
    }
    if(textBytes[0]===0xFF && textBytes[1]===0xFE){
      return {name:'UTF-16 LE Text (BOM)', mime:'text/plain', ext:'txt', matches:[]};
    }
    if(textBytes[0]===0xFE && textBytes[1]===0xFF){
      return {name:'UTF-16 BE Text (BOM)', mime:'text/plain', ext:'txt', matches:[]};
    }
    const txt = new TextDecoder('utf-8',{fatal:false}).decode(textBytes);
    const printableCount = txt.split('').filter(c=>{
      const code = c.charCodeAt(0);
      return (code >= 32 && code < 127) || code === 9 || code === 10 || code === 13;
    }).length;
    const ratio = printableCount / Math.max(1, txt.length);
    if(ratio > 0.95) return {name:'Plain Text (UTF-8)', mime:'text/plain', ext:'txt', matches:[]};
    if(ratio > 0.75) return {name:'Mostly Text / Mixed', mime:'text/plain', ext:'txt', matches:[]};
    return {name:'Unknown / No Extension', mime:'application/octet-stream', ext:'bin', matches:[]};
  }

  const best = matches.reduce((a,b)=>a.sig.length >= b.sig.length ? a : b);
  return {name: best.name, mime: best.mime, ext: best.ext, matches};
}

function faExtractStrings(bytes, minLen, maxResults){
  const strings = [];
  let current = '';
  let currentStart = 0;
  const isPrintable = b => (b >= 32 && b < 127);
  for(let i=0;i<bytes.length;i++){
    const b = bytes[i];
    if(isPrintable(b)){
      if(!current) currentStart = i;
      current += String.fromCharCode(b);
    } else {
      if(current.length >= minLen){
        strings.push({offset: currentStart, text: current});
        if(strings.length >= maxResults) break;
      }
      current = '';
    }
  }
  if(current.length >= minLen && strings.length < maxResults){
    strings.push({offset: currentStart, text: current});
  }
  return strings;
}

function faRunAnalysis(){
  const bytes = faCurrentBytes;
  if(!bytes) return;
  const fileName = window._faFileName || 'file';
  const fileSize = window._faFileSize || bytes.length;

  // Summary
  $('faSummary').style.display = 'block';
  const entropy = udEntropy(bytes);
  const readability = udReadability(bytes);
  const type = faDetectType(bytes);
  const isEncrypted = entropy > 7.5 && readability < 40;
  const isCompressed = (entropy > 6.5 && entropy < 7.5) || /ZIP|Gzip|Archive|RAR|7-Zip|Bzip|XZ|CAB|ISO/.test(type.name);
  const isGraphic = /Image|PNG|JPEG|GIF|WebP|AVIF|HEIC|HEIF|PSD|SVG|TIFF|RAW|CR2|CR3|NEF|ARW|DNG|ORF|RAF|RW2|XCF|KRA|JXL|EXR|HDR|ICO|BMP|DDS|KTX|ASTC|PVR|Basis/i.test(type.name);
  const isGame = /Unity|Unreal|Valve|Bethesda|Godot|GameMaker|RPG Maker|Wwise|FMOD|Rockstar|Blizzard|Riot|Steam|Game|XNB|Asset/i.test(type.name);

  $('faSummaryBody').innerHTML = `
    <div class="kv"><b>Tên file</b><span>${esc(fileName)}</span></div>
    <div class="kv"><b>Kích thước</b><span>${udFmtBytes(fileSize)} (${fileSize.toLocaleString()} bytes)</span></div>
    <div class="kv"><b>Loại phát hiện</b><span><span class="chip cyan">${esc(type.name)}</span></span></div>
    <div class="kv"><b>MIME</b><span>${esc(type.mime || 'unknown')}</span></div>
    <div class="kv"><b>Đuôi mở rộng</b><span>.${esc(type.ext || '?')}</span></div>
    <div class="kv"><b>Entropy</b><span>${entropy.toFixed(4)} / 8.0 bits/byte</span></div>
    <div class="kv"><b>Độ đọc được</b><span>${readability.toFixed(1)}%</span></div>
    <div class="kv"><b>Trạng thái</b><span>${
      isEncrypted
        ? '<span class="chip pink">🔒 CÓ THỂ ĐÃ MÃ HÓA</span>'
        : isCompressed
          ? '<span class="chip amber">📦 CÓ THỂ NÉN</span>'
          : isGraphic
            ? '<span class="chip cyan">🖼️ FILE ĐỒ HỌA</span>'
            : isGame
              ? '<span class="chip violet">🎮 GAME ASSET</span>'
              : '<span class="chip green">✅ BÌNH THƯỜNG</span>'
    }</span></div>
  `;

  // Entropy detail
  $('faEntropy').style.display = 'block';
  $('faEntropyVal').textContent = entropy.toFixed(4);
  const bar = $('faEntropyBar');
  bar.style.width = (entropy/8*100) + '%';
  bar.style.background = entropy > 7.5
    ? 'linear-gradient(90deg,#ef4444,#ec4899)'
    : entropy > 6
      ? 'linear-gradient(90deg,#f59e0b,#22d3ee)'
      : 'linear-gradient(90deg,#22c55e,#22d3ee)';

  const verdict = $('faEntropyVerdict');
  let vText = '', vClass = '';
  if(entropy >= 7.9){ vText = '🔐 Rất có thể đã mã hóa (entropy ~8.0)'; vClass='pink'; }
  else if(entropy >= 7.5){ vText = '🔒 Có dấu hiệu mã hóa / nén cao'; vClass='pink'; }
  else if(entropy >= 6.5){ vText = '📦 Nén / nhị phân phức tạp'; vClass='amber'; }
  else if(entropy >= 4.5){ vText = '📄 Văn bản / code thông thường'; vClass='cyan'; }
  else if(entropy >= 2){ vText = '📃 Văn bản có cấu trúc lặp lại'; vClass='cyan'; }
  else { vText = '⬜ Dữ liệu rất đơn giản / trống'; vClass='green'; }
  verdict.innerHTML = `<div class="kv"><b>Đánh giá</b><span><span class="chip ${vClass}">${vText}</span></span></div>`;

  const chunkCount = 16;
  const chunkSize = Math.max(1, Math.floor(bytes.length / chunkCount));
  const chunks = [];
  for(let i=0;i<chunkCount;i++){
    const start = i * chunkSize;
    const end = Math.min(bytes.length, start + chunkSize);
    if(start >= bytes.length) break;
    chunks.push(udEntropy(bytes.slice(start, end)));
  }
  const chartEl = $('faEntropyChart');
  if(chartEl){
    chartEl.innerHTML = chunks.map((e,i)=>`
      <div class="bar-col">
        <div class="bar-fill" style="height:${(e/8)*100}%;background:${e>7.5?'var(--red)':e>6?'var(--amber)':'var(--cyan)'}"></div>
        <small>#${i+1}<br><b>${e.toFixed(2)}</b></small>
      </div>
    `).join('');
  }

  // Magic
  $('faMagic').style.display = 'block';
  const detected = faDetectType(bytes);
  const preview = Array.from(bytes.slice(0, 32)).map(b=>b.toString(16).padStart(2,'0')).join(' ');
  let magicHtml = `
    <div class="kv"><b>Chữ ký (32 bytes đầu)</b><span style="font-family:monospace;font-size:11px;word-break:break-all">${preview}</span></div>
    <div class="kv"><b>Kết quả</b><span><span class="chip cyan">${esc(detected.name)}</span> (${esc(detected.mime||'unknown')})</span></div>
  `;
  if(detected.matches && detected.matches.length > 1){
    magicHtml += '<div style="margin-top:14px"><b>Khớp với nhiều chữ ký:</b><br>';
    magicHtml += detected.matches.map(m=>`<span class="tag" style="margin:2px">${esc(m.name)}</span>`).join('');
    magicHtml += '</div>';
  }
  $('faMagicBody').innerHTML = magicHtml;

  // Byte stats
  $('faByteStats').style.display = 'block';
  let min = 255, max = 0, sum = 0, nulls = 0, printable = 0;
  const freq = new Array(256).fill(0);
  for(let i=0;i<bytes.length;i++){
    const b = bytes[i];
    if(b < min) min = b;
    if(b > max) max = b;
    sum += b;
    if(b === 0) nulls++;
    if((b>=32 && b<127) || b===9 || b===10 || b===13) printable++;
    freq[b]++;
  }
  const avg = sum / bytes.length;
  const expected = bytes.length / 256;
  let chi = 0;
  for(let i=0;i<256;i++){
    const diff = freq[i] - expected;
    chi += (diff * diff) / expected;
  }

  $('faBMin').textContent = min;
  $('faBMax').textContent = max;
  $('faBAvg').textContent = avg.toFixed(2);
  $('faBNull').textContent = nulls + ' (' + (nulls/bytes.length*100).toFixed(1) + '%)';
  $('faBPrint').textContent = (printable/bytes.length*100).toFixed(1) + '%';
  $('faBChi').textContent = chi.toFixed(0);

  const histEl = $('faHistogram');
  if(histEl){
    const groups = 32;
    const groupSize = 8;
    const grouped = new Array(groups).fill(0);
    for(let i=0;i<256;i++) grouped[Math.floor(i/groupSize)] += freq[i];
    const maxG = Math.max(...grouped);
    histEl.innerHTML = '<div style="font-size:11px;color:var(--fg3);margin-bottom:6px">Histogram phân bố byte (32 nhóm × 8 giá trị)</div>' +
      '<div class="chart" style="height:100px">' +
      grouped.map((c,i)=>`<div class="bar-col"><div class="bar-fill" style="height:${(c/maxG)*100}%"></div></div>`).join('') +
      '</div>';
  }

  // Hex dump
  $('faHexPanel').style.display = 'block';
  const hexLimit = parseInt($('faHexBytes').value) || 512;
  $('faHexDump').textContent = udHexDump(bytes, hexLimit);

  // Strings
  $('faStrings').style.display = 'block';
  const strings = faExtractStrings(bytes, 4, 200);
  $('faStringsOut').textContent = strings.length
    ? strings.slice(0, 100).map(s=>s.text).join('\n')
    : '(không có strings đáng chú ý)';

  // Advanced
  $('faAsn').style.display = 'block';
  const adv = [];
  const asText = new TextDecoder('utf-8',{fatal:false}).decode(bytes.slice(0, 1000));
  if(/^[A-Za-z0-9+/=\s_-]+$/.test(asText) && asText.trim().length > 20 && !/[^A-Za-z0-9+/=\s_-]/.test(asText.trim())){
    adv.push({label:'Có thể là Base64', detail:'Nội dung chỉ chứa ký tự base64', chip:'amber'});
  }
  if(/^[0-9a-fA-F\s]+$/.test(asText) && asText.replace(/\s/g,'').length > 20){
    adv.push({label:'Có thể là Hex', detail:'Nội dung chỉ chứa 0-9a-f', chip:'amber'});
  }
  if(bytes.length % 16 === 0 && entropy > 7.5){
    adv.push({label:'Có thể là AES/block cipher', detail:`Kích thước ${bytes.length} chia hết cho 16`, chip:'pink'});
  }
  const ext = fileName.split('.').pop().toLowerCase();
  const hasExt = /\.[a-z0-9]{1,8}$/i.test(fileName);
  if(detected.ext && ext && detected.ext !== ext && detected.ext !== '?' && !['txt','dat','bin','log'].includes(ext) && hasExt){
    adv.push({label:'Đuôi file không khớp chữ ký', detail:`Đuôi .${ext} nhưng nội dung là ${detected.name}`, chip:'pink'});
  }
  if(!hasExt){
    adv.push({label:'📎 Không có đuôi mở rộng', detail:`Phát hiện loại qua magic bytes: ${detected.name}`, chip:'cyan'});
  }
  if(entropy > 7.8){
    adv.push({label:'Entropy rất cao', detail:'Khả năng cao là dữ liệu đã mã hóa/random', chip:'pink'});
  }
  if(nulls / bytes.length > 0.8){
    adv.push({label:'Chủ yếu null bytes', detail:'Có thể là file trống hoặc đã bị zero-fill', chip:'amber'});
  }
  if(isGame){
    adv.push({label:'🎮 Game Asset', detail:'Định dạng file game — có thể nén/mã hóa bởi engine', chip:'violet'});
  }
  if(isGraphic && readability < 50){
    adv.push({label:'🖼️ File đồ họa nhị phân', detail:'Nội dung nén/binary — bình thường', chip:'green'});
  }
  if(/Certificate|PEM|DER|KeyStore|Key/i.test(detected.name)){
    adv.push({label:'🔐 Certificate / Key', detail:'File chứa khóa mật mã — cẩn thận khi chia sẻ', chip:'pink'});
  }
  if(/Firmware|Android|Boot|UBIFS/i.test(detected.name)){
    adv.push({label:'📱 Firmware / Boot Image', detail:'File hệ thống — không sửa trực tiếp', chip:'pink'});
  }

  $('faAsnBody').innerHTML = adv.length
    ? adv.map(a=>`
      <div class="item" style="margin-bottom:8px">
        <div class="item-head"><div>
          <div class="item-title"><span class="chip ${a.chip}">${esc(a.label)}</span></div>
          <div class="item-sub">${esc(a.detail)}</div>
        </div></div>
      </div>`).join('')
    : '<div class="empty">Không có dấu hiệu bất thường</div>';

  addLog('FILE_ANALYZE', fileName + ' | ' + detected.name);
  toast('Đã phân tích: ' + fileName);
}

/* --- Curl Converter --- */
function convertCurl(){
  const raw=$('cuIn').value.trim();
  const lang=$('cuLang').value;
  const m=raw.match(/curl\s+(?:-X\s+(\w+)\s+)?(?:'([^']+)'|"([^"]+)"|(\S+))/);
  const method=(m&&m[1])||'GET';
  const url=(m&&(m[2]||m[3]||m[4]))||'';
  const headers={};
  const hRe=/-H\s+(?:'([^']+)'|"([^"]+)")/g;let h;
  while((h=hRe.exec(raw))){const line=h[1]||h[2];const [k,...v]=line.split(':');headers[k.trim()]=v.join(':').trim()}
  const dM=raw.match(/(?:-d|--data)\s+(?:'([^']+)'|"([^"]+)")/);
  const body=dM?(dM[1]||dM[2]):'';
  let out='';
  if(lang==='javascript-fetch'){
    out=`const res = await fetch("${url}", {\n  method: "${method}",\n  headers: ${JSON.stringify(headers,null,2)}${body?',\n  body: JSON.stringify('+body+')':''}\n});\nconst data = await res.json();`;
  } else if(lang==='python-requests'){
    out=`import requests\n\nresponse = requests.${method.toLowerCase()}(\n    "${url}",\n    headers=${JSON.stringify(headers,null,4)}${body?',\n    json='+body:''}\n)\nprint(response.json())`;
  } else if(lang==='php-curl'){
    out=`<?php\n$ch = curl_init();\ncurl_setopt($ch, CURLOPT_URL, "${url}");\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\ncurl_close($ch);\necho $response;`;
  } else if(lang==='go'){
    out=`package main\n\nimport (\n  "fmt"\n  "io"\n  "net/http"\n)\n\nfunc main() {\n  req, _ := http.NewRequest("${method}", "${url}", nil)\n  res, _ := http.DefaultClient.Do(req)\n  defer res.Body.Close()\n  data, _ := io.ReadAll(res.Body)\n  fmt.Println(string(data))\n}`;
  } else if(lang==='bash'){
    out=raw;
  } else {
    out=`// ${lang}\n// URL: ${url}\n// Method: ${method}\n// TODO: implement for ${lang}`;
  }
  $('cuOut').textContent=out;
}

function jsonToYaml(){
  try{
    const obj=JSON.parse($('jsInput').value);
    const toYaml=(o,i=0)=>{const sp='  '.repeat(i);if(o===null)return'null';if(typeof o!=='object')return JSON.stringify(o);if(Array.isArray(o))return o.map(x=>sp+'- '+toYaml(x,i+1).trim()).join('\n');return Object.entries(o).map(([k,v])=>{if(v&&typeof v==='object')return sp+k+':\n'+toYaml(v,i+1);return sp+k+': '+toYaml(v,i)}).join('\n')};
    $('jsOutput').textContent=toYaml(obj);
  }catch(e){$('jsOutput').textContent='Lỗi: '+e.message}

function jsonToQuery(){
  try{
    const obj=JSON.parse($('jsInput').value);const pairs=[];
    const walk=(p,o)=>{if(o===null||o===undefined)return;if(typeof o==='object')Object.keys(o).forEach(k=>walk(p?p+'['+k+']':k,o[k]));else pairs.push(encodeURIComponent(p)+'='+encodeURIComponent(o))};
    walk('',obj);$('jsOutput').textContent=pairs.join('&');
  }catch(e){$('jsOutput').textContent='Lỗi: '+e.message}
}

/* --- XML --- */
function xmlFormat(){
  try{
    const doc=new DOMParser().parseFromString($('xmlIn').value,'text/xml');
    if(doc.querySelector('parsererror'))throw new Error('XML không hợp lệ');
    const ser=new XMLSerializer();
    let xml=ser.serializeToString(doc);
    let formatted='';let indent=0;xml.split(/(<[^>]+>)/).filter(x=>x.trim()).forEach(t=>{
      if(t.startsWith('</'))indent--;
      formatted+='  '.repeat(indent)+t+'\n';
      if(t.startsWith('<')&&!t.startsWith('</')&&!t.endsWith('/>')&&!t.match(/<\/[^>]+>$/))indent++;
    });
    $('xmlOut').textContent=formatted.trim();
  }catch(e){$('xmlOut').textContent='Lỗi: '+e.message}
}
function xmlMinify(){$('xmlOut').textContent=$('xmlIn').value.replace(/>\s+</g,'><').trim()}
function xmlValidate(){try{const d=new DOMParser().parseFromString($('xmlIn').value,'text/xml');$('xmlOut').textContent=d.querySelector('parsererror')?'❌ Không hợp lệ':'✅ XML hợp lệ'}catch(e){$('xmlOut').textContent='❌ '+e.message}}
function xmlToJson(){
  try{
    const doc=new DOMParser().parseFromString($('xmlIn').value,'text/xml');
    const nodeToObj=n=>{
      const obj={};
      if(n.attributes)for(const a of n.attributes)obj['@'+a.name]=a.value;
      const children=[...n.children];
      if(children.length===0)return n.textContent.trim();
      const groups={};
      children.forEach(c=>{(groups[c.tagName]=groups[c.tagName]||[]).push(nodeToObj(c))});
      for(const k in groups)obj[k]=groups[k].length===1?groups[k][0]:groups[k];
      return obj;
    };
    $('xmlOut').textContent=JSON.stringify(nodeToObj(doc.documentElement),null,2);
  }catch(e){$('xmlOut').textContent='Lỗi: '+e.message}
}

/* --- TOML --- */
function parseTOML(){
  const text=$('tomlIn').value;
  const out={};let current=out;
  text.split('\n').forEach(line=>{
    line=line.trim();
    if(!line||line.startsWith('#'))return;
    const sec=line.match(/^\[([^\]]+)\]$/);
    if(sec){
      const path=sec[1].split('.');
      current=out;
      path.forEach(p=>{current[p]=current[p]||{};current=current[p]});
      return;
    }
    const m=line.match(/^([^=]+)=(.+)$/);
    if(m){
      let k=m[1].trim(),v=m[2].trim();
      if(/^"(.*)"$/.test(v)||/^'(.*)'$/.test(v))v=v.slice(1,-1);
      else if(/^(true|false)$/.test(v))v=v==='true';
      else if(/^-?\d+(\.\d+)?$/.test(v))v=parseFloat(v);
      current[k]=v;
    }
  });
  $('tomlOut').textContent=JSON.stringify(out,null,2);
}

/* --- ENV --- */
function parseEnv(){
  const out={};
  $('envIn').value.split('\n').forEach(line=>{
    line=line.trim();if(!line||line.startsWith('#'))return;
    const m=line.match(/^([^=]+)=(.+)$/);
    if(m){
      let v=m[2].trim();
      if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'")))v=v.slice(1,-1);
      out[m[1].trim()]=v;
    }
  });
  $('envOut').textContent=JSON.stringify(out,null,2);
}

/* --- SQL Format --- */
function formatSQL(){
  const kws=['SELECT','FROM','WHERE','JOIN','LEFT','RIGHT','INNER','OUTER','ON','GROUP BY','ORDER BY','HAVING','LIMIT','OFFSET','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','ALTER','DROP','UNION','AND','OR'];
  let sql=$('sqIn').value;
  kws.forEach(k=>{
    sql=sql.replace(new RegExp('\\b'+k+'\\b','gi'),'\n'+k.toUpperCase());
  });
  sql=sql.replace(/\s+/g,' ').replace(/\n\s*/g,'\n').replace(/,\s*/g,',\n  ').trim();
  $('sqOut').textContent=sql;
}

/* --- Query Builder --- */
function buildQuery(){
  const op=$('qbOp').value,tbl=$('qbTable').value,cols=$('qbCols').value,wh=$('qbWhere').value,ord=$('qbOrder').value,lim=$('qbLimit').value;
  let q='';
  if(op==='SELECT'){
    q=`SELECT ${cols} FROM ${tbl}`;
    if(wh)q+=`\nWHERE ${wh}`;
    if(ord)q+=`\nORDER BY ${ord}`;
    if(lim)q+=`\nLIMIT ${lim}`;
  } else if(op==='INSERT'){q=`INSERT INTO ${tbl} (${cols}) VALUES (...)`}
  else if(op==='UPDATE'){q=`UPDATE ${tbl}\nSET ${cols}\nWHERE ${wh||'condition'}`}
  else if(op==='DELETE'){q=`DELETE FROM ${tbl}${wh?'\nWHERE '+wh:''}`}
  $('qbOut').textContent=q+';';
}

/* --- Signature --- */
let sigCtx=null,sigDrawing=false,sigColor='#000';
function initSig(){
  const c=$('sigCanvas');if(!c)return;
  sigCtx=c.getContext('2d');
  sigCtx.strokeStyle=sigColor;sigCtx.lineWidth=2;sigCtx.lineCap='round';
  const start=e=>{
    sigDrawing=true;const r=c.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    sigCtx.beginPath();sigCtx.moveTo(x,y);
  };
  const move=e=>{
    if(!sigDrawing)return;e.preventDefault();
    const r=c.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    sigCtx.lineTo(x,y);sigCtx.stroke();
  };
  const end=()=>{sigDrawing=false};
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function clearSig(){if(sigCtx)sigCtx.clearRect(0,0,800,300)}
function saveSig(){
  const c=$('sigCanvas');
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='signature.png';a.click();
}
function setSigColor(c){sigColor=c;if(sigCtx)sigCtx.strokeStyle=c}
document.addEventListener('input',e=>{if(e.target.id==='sigWidth'&&sigCtx)sigCtx.lineWidth=parseInt(e.target.value)});

/* --- Drawing --- */
let drawCtx=null,drawing=false,drawMode='pen',drawStart=null,drawSnapshot=null;
function initDraw(){
  const c=$('drawCanvas');if(!c)return;
  drawCtx=c.getContext('2d');
  drawCtx.fillStyle='#fff';drawCtx.fillRect(0,0,800,500);
  c.onmousedown=startDraw;c.onmousemove=moveDraw;c.onmouseup=endDraw;c.onmouseleave=endDraw;
  c.ontouchstart=startDraw;c.ontouchmove=moveDraw;c.ontouchend=endDraw;
}
function startDraw(e){
  drawing=true;const r=$('drawCanvas').getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  drawStart={x,y};
  drawSnapshot=drawCtx.getImageData(0,0,800,500);
  if(drawMode==='pen'||drawMode==='eraser'){drawCtx.beginPath();drawCtx.moveTo(x,y)}
}
function moveDraw(e){
  if(!drawing)return;e.preventDefault();
  const r=$('drawCanvas').getBoundingClientRect();
  const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  const color=$('drawColor').value,size=parseInt($('drawSize').value);
  drawCtx.lineWidth=size;drawCtx.lineCap='round';
  drawCtx.strokeStyle=drawMode==='eraser'?'#fff':color;
  if(drawMode==='pen'||drawMode==='eraser'){drawCtx.lineTo(x,y);drawCtx.stroke()}
  else {
    drawCtx.putImageData(drawSnapshot,0,0);
    drawCtx.beginPath();
    if(drawMode==='line'){drawCtx.moveTo(drawStart.x,drawStart.y);drawCtx.lineTo(x,y)}
    else if(drawMode==='rect'){drawCtx.rect(drawStart.x,drawStart.y,x-drawStart.x,y-drawStart.y)}
    else if(drawMode==='circle'){const rx=Math.abs(x-drawStart.x),ry=Math.abs(y-drawStart.y);drawCtx.ellipse(drawStart.x,drawStart.y,rx,ry,0,0,Math.PI*2)}
    drawCtx.stroke();
  }
}

/* --- Generators --- */
function genPassword(){
  const len=Math.max(4,Math.min(256,parseInt($('genLen').value)||20));
  const up=$('genUpper').checked,lo=$('genLower').checked,nu=$('genNum').checked,sy=$('genSym').checked,noAmb=$('genNoAmbig').checked;
  let chars='';
  if(up)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(lo)chars+='abcdefghijklmnopqrstuvwxyz';
  if(nu)chars+='0123456789';
  if(sy)chars+='!@#$%^&*()-_=+[]{};:,.<>?/|~';
  if(noAmb)chars=chars.replace(/[l1IO0o]/g,'');
  if(!chars){toast('Chọn ít nhất 1 loại','err');return}
  const rnd=crypto.getRandomValues(new Uint32Array(len));
  let out='';for(let i=0;i<len;i++)out+=chars[rnd[i]%chars.length];
  $('genOut').textContent=out;
  let score=len*3;
  if(up)score+=10;if(lo)score+=10;if(nu)score+=10;if(sy)score+=20;
  score=Math.min(100,score);
  const bar=$('genBar');bar.style.width=score+'%';
  bar.style.background=score<50?'linear-gradient(90deg,#ef4444,#f59e0b)':score<80?'linear-gradient(90deg,#f59e0b,#22d3ee)':'linear-gradient(90deg,#22c55e,#22d3ee)';
  const bits=Math.log2(chars.length)*len;
  const combos=Math.pow(chars.length,len);
  const secs=combos/2e10;
  $('genEntropy').innerHTML=`Entropy: <b style="color:var(--cyan)">${bits.toFixed(1)} bits</b> · Bẻ khóa: <b>${formatTime(secs)}</b>`;
  addLog('GEN_PASS','len='+len);
}

/* --- UUID --- */
function genUUIDs(){
  const qty=Math.min(1000,Math.max(1,parseInt($('uuQty').value)||5));
  const type=$('uuType').value;const out=[];
  for(let i=0;i<qty;i++){
    if(type==='uuid')out.push(crypto.randomUUID());
    else if(type==='nanoid'){const a=crypto.getRandomValues(new Uint8Array(21));const ch='useandom-26T198340PX75pxJACKVERYMINDBUSHWOLFGQZbfghjklqvwyzrict';out.push(Array.from(a).map(x=>ch[x%ch.length]).join(''))}
    else if(type==='apikey'){const a=crypto.getRandomValues(new Uint8Array(32));out.push('sk_'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''))}
    else if(type==='license'){const mk=()=>{const a=crypto.getRandomValues(new Uint8Array(4));return Array.from(a).map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join('')};out.push(`${mk()}-${mk()}-${mk()}-${mk()}`)}
    else if(type==='hex'){const a=crypto.getRandomValues(new Uint8Array(32));out.push(Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''))}
    else if(type==='base64'){const a=crypto.getRandomValues(new Uint8Array(24));out.push(b64enc(a))}
    else if(type==='ulid'){const ts=Date.now().toString(36).padStart(10,'0').toUpperCase();const a=crypto.getRandomValues(new Uint8Array(16));const ch='0123456789ABCDEFGHJKMNPQRSTVWXYZ';out.push(ts+Array.from(a).map(x=>ch[x%ch.length]).join('').slice(0,16))}
  }
  $('uuOut').textContent=out.join('\n');
}

function buildConverter(){
  const t=$('cvType').value;const u=Object.keys(UNITS[t]);
  const f=$('cvFromU'),to=$('cvToU');if(!f)return;
  f.innerHTML=u.map(x=>`<option>${x}</option>`).join('');
  to.innerHTML=u.map(x=>`<option>${x}</option>`).join('');

}
function doConvert(){
  const t=$('cvType').value,v=parseFloat($('cvFrom').value)||0,from=$('cvFromU').value,to=$('cvToU').value;
  let r;
  if(t==='temp'){let c;if(from==='C')c=v;else if(from==='F')c=(v-32)*5/9;else c=v-273.15;if(to==='C')r=c;else if(to==='F')r=c*9/5+32;else r=c+273.15}
  else{const base=v*UNITS[t][from];r=base/UNITS[t][to]}
  $('cvOut').textContent=`${v} ${from} = ${r.toFixed(6).replace(/\.?0+$/,'')} ${to}`;
}

/* --- Loan --- */
function calcLoan(){
  const p=parseFloat($('lnAmount').value)||0;
  const r=parseFloat($('lnRate').value)/100/12;
  const n=parseInt($('lnYears').value)*12;
  if(!p||!r||!n){toast('Nhập đủ','err');return}
  const monthly=p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  const total=monthly*n;
  $('lnOut').textContent=monthly.toLocaleString('vi-VN',{maximumFractionDigits:0})+'đ/tháng';
  $('lnDetail').innerHTML=`

    <div class="kv"><b>Tổng lãi</b><span>${(total-p).toLocaleString('vi-VN',{maximumFractionDigits:0})}đ</span></div>
    <div class="kv"><b>Tổng phải trả</b><span>${total.toLocaleString('vi-VN',{maximumFractionDigits:0})}đ</span></div>`;
}

/* --- Tax --- */
function calcTax(){
  const income=parseFloat($('txIncome').value)||0;
  const dep=parseInt($('txDep').value)||0;
  const ins=parseFloat($('txIns').value)||0;
  const personalDeduct=11000000;
  const depDeduct=4400000*dep;
  const taxable=Math.max(0,income-ins-personalDeduct-depDeduct);
  let tax=0;
  const brackets=[[5000000,0.05],[5000000,0.1],[8000000,0.15],[14000000,0.2],[20000000,0.25],[28000000,0.3],[Infinity,0.35]];
  let rem=taxable;
  for(const [amt,rate] of brackets){
    if(rem<=0)break;
    const t=Math.min(rem,amt);
    tax+=t*rate;
    rem-=t;
  }
  $('txOut').textContent=tax.toLocaleString('vi-VN',{maximumFractionDigits:0})+'đ';
  $('txDetail').innerHTML=`
    <div class="kv"><b>Thu nhập</b><span>${income.toLocaleString('vi-VN')}đ</span></div>
    <div class="kv"><b>Bảo hiểm</b><span>${ins.toLocaleString('vi-VN')}đ</span></div>
    <div class="kv"><b>Giảm trừ bản thân</b><span>${personalDeduct.toLocaleString('vi-VN')}đ</span></div>
    <div class="kv"><b>Giảm trừ phụ thuộc (${dep})</b><span>${depDeduct.toLocaleString('vi-VN')}đ</span></div>
    <div class="kv"><b>Thu nhập chịu thuế</b><span>${taxable.toLocaleString('vi-VN')}đ</span></div>
    <div class="kv"><b style="color:var(--red)">Thuế phải nộp</b><span style="color:var(--red);font-weight:700">${tax.toLocaleString('vi-VN',{maximumFractionDigits:0})}đ</span></div>
    <div class="kv"><b>Thực nhận</b><span style="color:var(--green);font-weight:700">${(income-ins-tax).toLocaleString('vi-VN',{maximumFractionDigits:0})}đ</span></div>`;
}

/* --- Encode --- */
function encodeAs(t){
  const v=$('enInput').value;let out='';
  try{
    switch(t){
      case 'b64enc':out=btoa(unescape(encodeURIComponent(v)));break;
      case 'b64dec':out=decodeURIComponent(escape(atob(v)));break;
      case 'urlenc':out=encodeURIComponent(v);break;
      case 'urldec':out=decodeURIComponent(v);break;
      case 'htmlenc':out=v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');break;
      case 'htmldec':{const d=document.createElement('div');d.innerHTML=v;out=d.textContent;break}
      case 'hexenc':out=Array.from(new TextEncoder().encode(v)).map(b=>b.toString(16).padStart(2,'0')).join('');break;
      case 'hexdec':out=new TextDecoder().decode(new Uint8Array(v.match(/../g).map(h=>parseInt(h,16))));break;
      case 'rot13':out=v.replace(/[a-zA-Z]/g,c=>String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26));break;
      case 'binenc':out=Array.from(new TextEncoder().encode(v)).map(b=>b.toString(2).padStart(8,'0')).join(' ');break;
      case 'rev':out=v.split('').reverse().join('');break;
      case 'unicode':out=Array.from(v).map(c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')).join('');break;
    }
  }catch(e){out='Lỗi: '+e.message}
  $('enOutput').value=out;
}

/* --- Text Tools --- */
function ttStats(){
  const t=$('ttIn').value;
  const set=(id,v)=>{const e=$(id);if(e)e.textContent=v};
  set('ttChar',t.length);
  set('ttWord',t.trim()?t.trim().split(/\s+/).length:0);
  set('ttLine',t?t.split('\n').length:0);
  set('ttSent',(t.match(/[.!?]+/g)||[]).length);
}
function ttApply(op){
  const el=$('ttIn');let v=el.value;
  switch(op){
    case 'upper':v=v.toUpperCase();break;
    case 'lower':v=v.toLowerCase();break;
    case 'title':v=v.replace(/\b\w/g,c=>c.toUpperCase());break;
    case 'camel':v=v.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g,(_,c)=>c.toUpperCase());break;
    case 'snake':v=v.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_');break;
    case 'kebab':v=v.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');break;
    case 'reverse':v=v.split('').reverse().join('');break;
    case 'sortlines':v=v.split('\n').sort().join('\n');break;
    case 'uniq':v=[...new Set(v.split('\n'))].join('\n');break;
    case 'trim':v=v.split('\n').map(l=>l.trim()).join('\n');break;
    case 'numbers':v=(v.match(/-?\d+(\.\d+)?/g)||[]).join('\n');break;
    case 'emails':v=(v.match(/[\w.+-]+@[\w-]+\.[\w.-]+/g)||[]).join('\n');break;
    case 'urls':v=(v.match(/https?:\/\/[^\s]+/g)||[]).join('\n');break;
    case 'slug':v=v.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');break;
    case 'shuffle':v=v.split('\n').sort(()=>Math.random()-0.5).join('\n');break;
    case 'dedup-words':v=[...new Set(v.toLowerCase().split(/\s+/))].join(' ');break;
  }
  el.value=v;ttStats();
}

/* --- Markdown --- */
function renderMD(){
  const src=$('mdIn').value;
  let h=src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>`<pre class="code-box">${c}</pre>`)
    .replace(/`([^`]+)`/g,'<code style="background:rgba(34,211,238,.15);padding:2px 6px;border-radius:4px">$1</code>')
    .replace(/^###### (.*)$/gm,'<h6>$1</h6>').replace(/^##### (.*)$/gm,'<h5>$1</h5>')
    .replace(/^#### (.*)$/gm,'<h4>$1</h4>').replace(/^### (.*)$/gm,'<h3>$1</h3>')
    .replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" style="color:var(--cyan)" target="_blank">$1</a>')
    .replace(/^\- (.*)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>')
    .replace(/\n\n/g,'</p><p>');
  $('mdOut').innerHTML='<p>'+h+'</p>';
}

/* --- MD ↔ HTML --- */
function mdToHtml(){
  const src=$('mdcIn').value;
  let h=src.replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p>');
  $('mdcOut').value='<p>'+h+'</p>';
}
function htmlToMd(){
  const src=$('mdcIn').value;
  let md=src.replace(/<h1[^>]*>(.*?)<\/h1>/gi,'# $1\n').replace(/<h2[^>]*>(.*?)<\/h2>/gi,'## $1\n')
    .replace(/<h3[^>]*>(.*?)<\/h3>/gi,'### $1\n').replace(/<strong[^>]*>(.*?)<\/strong>/gi,'**$1**')
    .replace(/<em[^>]*>(.*?)<\/em>/gi,'*$1*').replace(/<a[^>]*href="([^"]+)"[^>]*>(.*?)<\/a>/gi,'[$2]($1)')
    .replace(/<li[^>]*>(.*?)<\/li>/gi,'- $1\n').replace(/<[^>]+>/g,'').replace(/\n\n+/g,'\n\n');
  $('mdcOut').value=md.trim();
}

/* --- Diff --- */
function runDiff(){
  const a=$('diffA').value.split('\n'),b=$('diffB').value.split('\n');
  const max=Math.max(a.length,b.length);const out=[];
  for(let i=0;i<max;i++){
    const la=a[i]??'',lb=b[i]??'';
    if(la===lb)out.push(`  ${la}`);
    else{if(la)out.push(`- ${la}`);if(lb)out.push(`+ ${lb}`)}
  }
  $('diffOut').innerHTML=out.map(l=>{
    if(l.startsWith('- '))return`<div style="background:rgba(239,68,68,.15);color:#fca5a5;padding:2px 6px;border-radius:3px">${esc(l)}</div>`;
    if(l.startsWith('+ '))return`<div style="background:rgba(34,197,94,.15);color:#86efac;padding:2px 6px;border-radius:3px">${esc(l)}</div>`;
    return`<div style="color:var(--fg2);padding:2px 6px">${esc(l)}</div>`;
  }).join('');
}

/* --- Case --- */
function caseConv(type){
  let v=$('caseIn').value;
  const words=()=>v.trim().split(/[\s_\-]+/).filter(Boolean);
  switch(type){
    case 'upper':v=v.toUpperCase();break;
    case 'lower':v=v.toLowerCase();break;
    case 'title':v=v.replace(/\b\w/g,c=>c.toUpperCase());break;
    case 'sentence':v=v.charAt(0).toUpperCase()+v.slice(1).toLowerCase();break;
    case 'camel':v=words().map((w,i)=>i?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w.toLowerCase()).join('');break;
    case 'pascal':v=words().map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join('');break;
    case 'snake':v=words().map(w=>w.toLowerCase()).join('_');break;
    case 'kebab':v=words().map(w=>w.toLowerCase()).join('-');break;
    case 'constant':v=words().map(w=>w.toUpperCase()).join('_');break;
    case 'dot':v=words().map(w=>w.toLowerCase()).join('.');break;
    case 'alternating':v=v.split('').map((c,i)=>i%2?c.toUpperCase():c.toLowerCase()).join('');break;
  }
  $('caseOut').value=v;
}

/* --- Pomodoro --- */
let pomoTimer=null,pomoLeft=25*60,pomoIsFocus=true,pomoRunning=false,pomoDone=0;
let pomoFocus=25,pomoBreak=5;
function pomoSet(f,s){
  clearInterval(pomoTimer);pomoRunning=false;pomoIsFocus=true;
  pomoLeft=f*60;pomoFocus=f;pomoBreak=s;
  updatePomoUI();
  const m=$('pomoMode');if(m)m.textContent='Focus Session';
}
function pomoStart(){
  if(pomoRunning)return;
  pomoRunning=true;
  pomoTimer=setInterval(()=>{
    pomoLeft--;
    if(pomoLeft<=0){
      if(pomoIsFocus){pomoDone++;pomoIsFocus=false;pomoLeft=pomoBreak*60;if($('pomoMode'))$('pomoMode').textContent='Break Time';toast('Hết phiên focus!')}
      else{pomoIsFocus=true;pomoLeft=pomoFocus*60;if($('pomoMode'))$('pomoMode').textContent='Focus Session';toast('Hết giờ nghỉ!')}
      if($('pomoDone'))$('pomoDone').textContent=pomoDone;
    }
    updatePomoUI();
  },1000);
}
function pomoPause(){clearInterval(pomoTimer);pomoRunning=false}
function pomoReset(){clearInterval(pomoTimer);pomoRunning=false;pomoLeft=pomoIsFocus?pomoFocus*60:pomoBreak*60;updatePomoUI()}
function updatePomoUI(){
  const m=String(Math.floor(pomoLeft/60)).padStart(2,'0'),s=String(pomoLeft%60).padStart(2,'0');
  const el=$('pomoTime');if(el)el.textContent=`${m}:${s}`;
}

/* --- Stopwatch --- */
let swTimer=null,swStart=0,swElapsed=0,swRunning=false,swLaps=[];
function swToggle(){
  if(swRunning){clearInterval(swTimer);swElapsed+=Date.now()-swStart;swRunning=false;$('swBtn').textContent='Start'}
  else{swStart=Date.now();swTimer=setInterval(updateSW,50);swRunning=true;$('swBtn').textContent='Pause'}
}
function updateSW(){
  const ms=swElapsed+(swRunning?Date.now()-swStart:0);
  const h=String(Math.floor(ms/3600000)).padStart(2,'0');
  const m=String(Math.floor((ms%3600000)/60000)).padStart(2,'0');
  const s=String(Math.floor((ms%60000)/1000)).padStart(2,'0');
  const cs=String(Math.floor((ms%1000)/10)).padStart(2,'0');
  const el=$('swTime');if(el)el.textContent=`${h}:${m}:${s}.${cs}`;
}
function swLap(){
  if(!swRunning)return;
  swLaps.push(swElapsed+(Date.now()-swStart));
  $('swLaps').innerHTML=swLaps.map((l,i)=>{
    const h=String(Math.floor(l/3600000)).padStart(2,'0');
    const m=String(Math.floor((l%3600000)/60000)).padStart(2,'0');
    const s=String(Math.floor((l%60000)/1000)).padStart(2,'0');
    const cs=String(Math.floor((l%1000)/10)).padStart(2,'0');
    return`<div>Lap ${i+1}: ${h}:${m}:${s}.${cs}</div>`;
  }).join('');
}
function swReset(){clearInterval(swTimer);swElapsed=0;swLaps=[];swRunning=false;updateSW();$('swLaps').innerHTML='';if($('swBtn'))$('swBtn').textContent='Start'}

/* --- Search --- */
async function runAdvSearch(){
  const d=await loadData();
  const q=($('asQ')?.value||'').toLowerCase().trim();
  const type=$('asType')?.value||'';
  const tag=($('asTag')?.value||'').toLowerCase().trim();
  const from=$('asFrom')?.value?new Date($('asFrom').value).getTime():0;
  const res=[];
  const check=(item,kind,title,body)=>{
    if(type&&type!==kind)return;
    if(from&&(item.t||0)<from)return;
    if(tag&&!(item.tags||[]).some(t=>t.toLowerCase().includes(tag)))return;
    const hay=((title||'')+' '+(body||'')+' '+((item.tags||[]).join(' '))).toLowerCase();
    if(!q||hay.includes(q))res.push({kind,item,title,body});
  };
  d.vault.forEach(it=>check(it,'vault',it.name,it.user+' '+it.pass+' '+it.note));
  d.notes.forEach(it=>check(it,'notes',it.title,it.body));
  d.files.forEach(it=>check(it,'files',it.name,it.body));
  d.docs.forEach(it=>check(it,'docs',it.name,it.body+' '+it.sig));
  d.code.forEach(it=>check(it,'code',it.name,it.body+' '+it.ver+' '+it.lic));
  const c=$('asResults');if(!c)return;
  const cm={vault:'cyan',notes:'violet',files:'green',docs:'amber',code:'pink'};
  c.innerHTML=res.length?res.map(r=>`<div class="item"><div class="item-head">
    <div><div class="item-title"><span class="chip ${cm[r.kind]}">${r.kind.toUpperCase()}</span>${esc(r.title)}</div>
    <div class="item-sub">${fmtTime(r.item.t)}</div></div></div>
    <div class="item-body">${esc((r.body||'').slice(0,400))}</div></div>`).join(''):'<div class="empty">Không tìm thấy</div>';
}

/* --- Piano --- */
let audioCtx=null,pianoKeys=null;
const NOTE_FREQ={C4:261.63,'C#4':277.18,D4:293.66,'D#4':311.13,E4:329.63,F4:349.23,'F#4':369.99,G4:392,'G#4':415.3,A4:440,'A#4':466.16,B4:493.88,C5:523.25,'C#5':554.37,D5:587.33,'D#5':622.25,E5:659.25};
const PIANO_KEYS=[
  {n:'C4',k:'a',b:false},{n:'C#4',k:'w',b:true},{n:'D4',k:'s',b:false},{n:'D#4',k:'e',b:true},
  {n:'E4',k:'d',b:false},{n:'F4',k:'f',b:false},{n:'F#4',k:'t',b:true},{n:'G4',k:'g',b:false},
  {n:'G#4',k:'y',b:true},{n:'A4',k:'h',b:false},{n:'A#4',k:'u',b:true},{n:'B4',k:'j',b:false},
  {n:'C5',k:'k',b:false},{n:'C#5',k:'o',b:true},{n:'D5',k:'l',b:false},{n:'D#5',k:'p',b:true},{n:'E5',k:';',b:false}
];
function initPiano(){
  const c=$('pianoKeys');if(!c)return;
  if(c.children.length)return;
  c.innerHTML=PIANO_KEYS.map(k=>`<div class="key ${k.b?'black':''}" data-note="${k.n}" data-key="${k.k}"><span>${k.k.toUpperCase()}</span></div>`).join('');
  c.querySelectorAll('.key').forEach(el=>{
    el.onmousedown=()=>playNote(el.dataset.note);
    el.ontouchstart=e=>{e.preventDefault();playNote(el.dataset.note)};
  });
  if(!pianoKeys){
    pianoKeys=true;
    document.addEventListener('keydown',e=>{
      if(currentPage!=='piano')return;
      const k=PIANO_KEYS.find(x=>x.k===e.key.toLowerCase());
      if(k)playNote(k.n);
    });
  }
}
function playNote(note){
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=$('pianoWave')?.value||'sine';
  osc.frequency.value=NOTE_FREQ[note]||440;
  gain.gain.value=parseFloat($('pianoVol')?.value||0.3);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1);
  osc.stop(audioCtx.currentTime+1);
}

/* --- Metronome --- */
let MT_RUNNING=false,MT_TIMER=null,MT_BEAT=0,mtCtx=null;
function initMt(){
  const c=$('mtBeats');if(!c)return;
  c.innerHTML=Array(4).fill(0).map((_,i)=>`<div style="width:20px;height:20px;border-radius:50%;background:var(--border);transition:.1s" data-beat="${i}"></div>`).join('');
}
function toggleMt(){MT_RUNNING?stopMt():startMt()}
function startMt(){
  if(!mtCtx)mtCtx=new (window.AudioContext||window.webkitAudioContext)();
  MT_RUNNING=true;
  const bpm=parseInt($('mtRange').value);
  const interval=60000/bpm;
  MT_BEAT=0;
  const tick=()=>{
    const osc=mtCtx.createOscillator(),g=mtCtx.createGain();
    osc.frequency.value=MT_BEAT===0?1000:800;
    g.gain.value=0.3;
    osc.connect(g);g.connect(mtCtx.destination);
    osc.start();g.gain.exponentialRampToValueAtTime(0.001,mtCtx.currentTime+0.05);
    osc.stop(mtCtx.currentTime+0.05);
    document.querySelectorAll('#mtBeats div').forEach((el,i)=>el.style.background=i===MT_BEAT?'var(--cyan)':'var(--border)');
    MT_BEAT=(MT_BEAT+1)%4;
  };
  tick();
  MT_TIMER=setInterval(tick,interval);
  const b=$('mtBtn');if(b)b.textContent='Stop';
}
function stopMt(){clearInterval(MT_TIMER);MT_RUNNING=false;const b=$('mtBtn');if(b)b.textContent='Start';document.querySelectorAll('#mtBeats div').forEach(el=>el.style.background='var(--border)')}

async function checkShareHash(){
  const h=location.hash;
  if(!h.startsWith('#share='))return;
  const code=h.slice(7);
  if(!CRYPTO_KEY){setTimeout(()=>{const m=$('lockMsg');if(m){m.textContent='🔗 Có link share. Nhập master key.';m.classList.add('ok')}},300);return}
  const d=await loadData();
  const s=d.shares.find(x=>x.code===code);
  if(!s){toast('Share không tồn tại','err');return}
  if(Date.now()>s.expires){toast('Share hết hạn','err');return}
  const item=d[s.type].find(x=>x.id===s.itemId);
  if(!item){toast('Mục không tồn tại','err');return}
  s.accesses=(s.accesses||0)+1;await saveData(d);
  openModal(`<h3>Nội dung chia sẻ</h3><div class="item-body">${esc(item.pass||item.body||'—')}</div><button class="btn" onclick="closeModal()">Đóng</button>`);
}

/* --- BOOT --- */
async function bootUI(){
  await populateLangs();
  await renderVault();await renderNotes();await renderFiles();await renderDocs();await renderCode();
  await renderDash();renderLogs();renderRecentLogs();renderTags();renderApis();renderSnapshots();
  renderShares();updateBadges();update2FAStatus();renderAudit();renderTodo();renderKanban();
  renderCalendar();renderHabits();renderBookmarks();renderContacts();renderClipboard();
  renderTools();renderSnippetLibrary();
  if($('stSize'))$('stSize').textContent=fmtSize();
}

window.addEventListener('load',async()=>{
  mountPages();
  buildNav();
  populateVoices();
  const theme=localStorage.getItem('sv_theme')||'dark';
  if($('setTheme'))$('setTheme').value=theme;
  document.body.classList.toggle('light',theme==='light');
  if($('setConfirm'))$('setConfirm').checked=localStorage.getItem('sv_confirm')!=='0';
  if($('setNotif'))$('setNotif').checked=localStorage.getItem('sv_notif')!=='0';
  setTimeout(()=>{initSig();initDraw();initMt();udInit();faInit();},100);
  sessionStorage.removeItem(LS.session);
  checkShareHash();
  ['click','keydown','mousemove','touchstart'].forEach(evt=>document.addEventListener(evt,()=>{LAST_ACTIVITY=Date.now()},{passive:true}));
  setInterval(()=>{if(!CRYPTO_KEY)return;if(Date.now()-LAST_ACTIVITY>30*60*1000){toast('Tự động khóa','err');lockApp()}},60000);
  document.addEventListener('change',e=>{
    if(e.target.id==='setConfirm')localStorage.setItem('sv_confirm',e.target.checked?'1':'0');
    if(e.target.id==='setNotif')localStorage.setItem('sv_notif',e.target.checked?'1':'0');
  });
});
document.addEventListener('keydown',e=>{
  if($('lock').classList.contains('hidden')){
    if(e.key==='Escape')lockApp();
    if(e.key==='k'&&(e.ctrlKey||e.metaKey)){e.preventDefault();go('search');setTimeout(()=>$('asQ')?.focus(),50)}
  } else{if(e.key==='Enter')tryUnlock()}
});
</script>
